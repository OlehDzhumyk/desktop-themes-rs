# pytest settings of the Wayland end-to-end harness (runs inside the container, tools/e2e-wayland.sh).
[pytest]
addopts = -p no:cacheprovider -ra
testpaths = .
log_level = INFO
# PyGObject on Python 3.15 warns about asyncio policy APIs it still touches; not ours
filterwarnings =
    ignore::DeprecationWarning:gi.events
