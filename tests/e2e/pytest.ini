# pytest settings of the end-to-end harness (runs inside the container, see tools/e2e.sh).
[pytest]
addopts = -p no:cacheprovider -p harness.github_annotations -ra
testpaths = .
log_level = INFO
# PyGObject on Python 3.15 warns about asyncio policy APIs it still touches; not ours
filterwarnings =
    ignore::DeprecationWarning:gi.events
markers =
    smoke: fast subset run on every pull request
