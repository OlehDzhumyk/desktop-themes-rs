[workspace]
resolver = "3"
members = ["crates/themes-core", "crates/themes", "crates/desk-proto", "crates/deskd", "crates/theme-tokens", "crates/desk-settings", "crates/desk-capture", "crates/desk-layouts", "crates/desk-search", "crates/desk-shell", "xtask"]
default-members = ["crates/themes-core", "crates/themes", "crates/desk-proto", "crates/deskd", "crates/theme-tokens", "crates/desk-settings", "crates/desk-capture", "crates/desk-layouts", "crates/desk-search", "crates/desk-shell"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# = the Rust of Fedora 45 = rust-toolchain.toml (tools/check-rust-version.sh). Not lower: gtk4-rs needs 1.92,
# so an older "MSRV" would only be a promise nobody tests.
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/OlehDzhumyk/desktop-themes-rs"

[workspace.dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10", "gtk_v4_24"] }
clap = { version = "4.6.9", features = ["derive"] }
gio = "0.22.11"
libc = "0.2.191"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_24"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = "6.5.0"
themes-core = { path = "crates/themes-core" }
desk-proto = { path = "crates/desk-proto" }
theme-tokens = { path = "crates/theme-tokens" }
desk-settings = { path = "crates/desk-settings" }
desk-capture = { path = "crates/desk-capture" }
desk-layouts = { path = "crates/desk-layouts" }
desk-search = { path = "crates/desk-search" }

# Selected clippy::pedantic lints (audit Q-7); the rest of pedantic stays off on purpose. Threshold of
# too_many_lines: clippy.toml. Fix the finding, or `#[allow(..., reason = "...")]` on the item.
[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
too_many_lines = "warn"
map_unwrap_or = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind, not abort: deskd must survive a panic in one handler or thread (see src/panic_policy.rs).
# Costs about 0.5 MB per binary; the code on the non-panicking path is unchanged.
panic = "unwind"
strip = true
