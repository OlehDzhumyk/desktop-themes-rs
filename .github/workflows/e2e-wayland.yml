# SPDX-License-Identifier: GPL-3.0-or-later
# Wayland end-to-end tests (tests/e2e-wayland): desk-shell --skin windows11 and deskd on labwc with
# the wlroots headless backend and the pixman renderer. No systemd and no GNOME Shell, so the suite
# itself takes about a second after the build; it runs on pull requests that touch desk-shell,
# deskd, the crates they link, or the labwc session data.
#
# Two jobs, as in e2e.yml: the binaries are built in a Fedora 45 container (the test image is
# Fedora 45 too, so they link against the same libraries), then tools/e2e-wayland.sh --no-build
# runs the tests with the runner's own podman.
name: E2E Wayland

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/desk-shell/**"
      - "crates/deskd/**"
      - "crates/desk-proto/**"
      - "crates/desk-search/**"
      - "crates/desk-settings/**"
      - "crates/desk-capture/**"
      - "crates/desk-layouts/**"
      - "crates/theme-tokens/**"
      - "data/labwc/**"
      - "data/io.github.OlehDzhumyk.Desk.gschema.xml"
      - "tests/e2e-wayland/**"
      - "tools/e2e-wayland.sh"
      - ".github/workflows/e2e-wayland.yml"
  workflow_dispatch:

concurrency:
  group: e2e-wayland-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build deskd, desk-shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config glib2-devel gtk4-devel pipewire-devel clang-devel rust cargo tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-fedora45-e2e-wayland-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora45-e2e-wayland-
      - name: Build
        run: cargo build --locked -p deskd -p desk-shell
      # a tarball keeps the executable bits (upload-artifact does not)
      - name: Pack
        run: tar -cf e2e-wayland-build.tar target/debug/deskd target/debug/desk-shell
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-wayland-build
          path: e2e-wayland-build.tar
          retention-days: 1

  test:
    name: labwc + desk-shell end-to-end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-wayland-build
      - name: Unpack
        run: tar -xf e2e-wayland-build.tar && rm e2e-wayland-build.tar
      - name: Run the tests
        run: tools/e2e-wayland.sh --no-build --out "$RUNNER_TEMP/e2e-wayland" -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-wayland-results
          path: ${{ runner.temp }}/e2e-wayland
          retention-days: 14
