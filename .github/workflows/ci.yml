# SPDX-License-Identifier: GPL-3.0-or-later
# Continuous integration. Rust jobs run in a Fedora 45 container (the target platform: GTK 4,
# libadwaita and GNOME Shell 51 come from the distribution, as on the developer's machine).
# The headless GNOME Shell end-to-end test lives in headless.yml (manual/scheduled, see there).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_INCREMENTAL: "0"

jobs:
  rust-fmt-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config glib2-devel gtk4-devel libadwaita-devel pipewire-devel clang-devel \
            rust cargo rustfmt clippy python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-fedora45-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora45-${{ github.job }}-
      - name: cargo fmt --check
        run: |
          set +e
          cargo fmt --all --check > fmt.diff 2>&1
          rc=$?
          {
            echo "### rustfmt: $([ $rc = 0 ] && echo clean || echo "$(grep -c '^Diff in' fmt.diff) hunks differ")"
            if [ $rc != 0 ]; then echo '```diff'; head -n 80 fmt.diff; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat fmt.diff
          exit $rc
      - name: cargo clippy
        run: |
          set +e
          cargo clippy --workspace --locked --all-targets -- -D warnings 2> clippy.log
          rc=$?
          {
            echo "### clippy: $([ $rc = 0 ] && echo clean || echo "$(grep -c '^\(warning\|error\)' clippy.log) messages")"
            if [ $rc != 0 ]; then echo '```'; head -n 80 clippy.log; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat clippy.log
          exit $rc
      - name: No orphan .rs files (not reachable from a module tree)
        run: |
          # The container runs as root on a checkout owned by another uid: let git read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/check-orphan-rs.sh

  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config glib2-devel gtk4-devel libadwaita-devel pipewire-devel clang-devel rust cargo tar gzip \
            pipewire wireplumber pipewire-utils dbus-daemon
          command -v curl >/dev/null || dnf install -y --setopt=install_weak_deps=False curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-fedora45-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora45-${{ github.job }}-
      - name: Install cargo-nextest (pinned, checksum-verified)
        run: tools/install-dev-tools.sh /usr/local/bin nextest
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (nextest, failures only)
        run: cargo nextest run --workspace --locked --profile ci
      - name: Doctests (nextest does not run them)
        run: cargo test --workspace --locked --doc

  rust-deny:
    name: cargo deny (licences, advisories)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: dnf install -y --setopt=install_weak_deps=False git cargo cargo-deny
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo deny check
        run: cargo deny check

  bridge:
    name: desk-bridge (tsc, eslint, build)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Install packages
        # bridge/ does not exist before checkout, so run this step from the workspace root.
        working-directory: .
        run: dnf install -y --setopt=install_weak_deps=False git nodejs npm glib2-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: Build the extension
        run: npm run build

  static-checks:
    name: shellcheck, schemas, desktop file, D-Bus XML
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git ShellCheck glib2-devel desktop-file-utils libxml2 python3 gettext appstream jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          # The container runs as root on a checkout owned by another uid: let git read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git ls-files -z | xargs -0 grep -IlE '^#!.*(ba)?sh' || true)
          test -n "$files" || { echo "no shell scripts found (git ls-files failed?)"; exit 1; }
          echo "$files" | tr '\n' '\0' | xargs -0 shellcheck --severity=warning
      - name: rust-version equals the pinned toolchain
        run: tools/check-rust-version.sh
      - name: Claude Code guard hook (table test)
        run: .claude/hooks/guard.test.sh
      - name: GSettings schema (strict)
        run: glib-compile-schemas --strict --dry-run data/
      - name: Desktop file and metainfo
        # The .desktop and metainfo files are gettext templates; build them as data/install.sh does.
        run: |
          for t in data/*.desktop.in; do
            out="$RUNNER_TEMP/$(basename "${t%.in}")"
            msgfmt --desktop -d po --template "$t" -o "$out"
            desktop-file-validate "$out"
          done
          for t in data/*.metainfo.xml.in; do
            out="$RUNNER_TEMP/$(basename "${t%.in}")"
            msgfmt --xml -d po --template "$t" -o "$out"
            appstreamcli validate --no-net --explain "$out" || echo "::warning::appstream findings in $t (report only)"
          done
      - name: D-Bus interface XML and extension metadata
        run: |
          xmllint --noout data/dbus/*.xml data/*.gschema.xml
          python3 -m json.tool bridge/static/metadata.json > /dev/null

  privacy:
    # Generic patterns only (home paths, private IPs, .local hosts, e-mail): personal patterns live
    # in untracked files on developers' machines, see tools/privacy-check.sh.
    name: privacy check (generic patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools/privacy-check.sh
        run: tools/privacy-check.sh --all

  ast-grep:
    name: ast-grep rules (tools/ast-grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ast-grep (pinned, checksum-verified)
        run: tools/install-dev-tools.sh "$HOME/.local/bin" ast-grep
      - name: Rule tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ast-grep test --skip-snapshot-tests
      - name: Scan (errors fail, warnings are reported)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ast-grep scan

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  docs:
    name: docs links (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules --exclude-path target --exclude-path .cargo-home '**/*.md'
          fail: true
