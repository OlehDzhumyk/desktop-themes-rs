# SPDX-License-Identifier: GPL-3.0-or-later
# Repository hygiene: spelling (typos), unused Cargo dependencies (cargo-machete) and workflow
# security lint (zizmor). Small, fast jobs with no build; third-party actions pinned by commit SHA.
name: Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typos:
    name: typos (spelling)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bnjbvr/cargo-machete@431e75731b681a69a4cfdeb1315b505778bb5c70 # v0.10.1

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          version: "1.33.0"
          advanced-security: false
          annotations: true
