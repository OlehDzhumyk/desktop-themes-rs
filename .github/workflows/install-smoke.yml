# SPDX-License-Identifier: GPL-3.0-or-later
# data/install.sh in a Fedora container with a throw-away HOME: no desktop session needed.
# Checks the dry run, the installed files (compiled schemas of the app and of the extensions that
# ship one, translated [uk] .desktop and metainfo) and a second install over the first.
name: Install smoke test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "data/**"
      - "extensions/**"
      - "bridge/**"
      - "po/**"
      - "scripts/**"
      - "tools/install-smoke.sh"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-sh:
    name: data/install.sh (dry run + real install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:62d5eaec1e8a34f6cb94934f806420754611834c7eef8a4f50b9cdbcd1c90c10
    steps:
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git findutils grep sed gettext glib2-devel nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-fedora45-${{ hashFiles('bridge/package-lock.json') }}
          restore-keys: npm-fedora45-
      - name: Build the bridge (install.sh installs bridge/build)
        working-directory: bridge
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: tools/install-smoke.sh
        run: tools/install-smoke.sh
