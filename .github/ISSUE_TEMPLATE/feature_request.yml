name: Feature request
description: Suggest a feature or a theme behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Which OS is it from?
      description: Features are matched to how the original behaves, so please say where the idea comes from.
      options:
        - Windows 11
        - macOS
        - Both Windows 11 and macOS
        - Stock GNOME / Fedora
        - Another OS or desktop (say which below)
        - Not from any OS
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How does it work there?
      description: Shortcuts, behaviour, edge cases; links to the vendor's documentation help. Please do not attach Apple or Microsoft assets (icons, fonts, sounds, wallpapers).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help build or test this
