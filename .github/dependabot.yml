version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    groups:
      rust: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /bridge
    schedule: {interval: weekly}
    groups:
      bridge: {patterns: ["*"]}
