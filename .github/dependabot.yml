version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      rust: {patterns: ["*"]}
  # Base images pinned by digest (Containerfile, tests/e2e/Containerfile). The images named in
  # workflow `container:` keys are refreshed with tools/update-image-digests.sh (docs/maintainer.md).
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: docker
    directory: /tests/e2e
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: npm
    directory: /bridge
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      bridge: {patterns: ["*"]}
    ignore:
      # typescript-eslint needs the TypeScript 6 compiler API; the build uses TypeScript 7 through
      # the alias typescript-native (see the "//" note in bridge/package.json).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
