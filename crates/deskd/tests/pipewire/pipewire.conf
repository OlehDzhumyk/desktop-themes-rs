# SPDX-License-Identifier: GPL-3.0-or-later
# A PipeWire daemon for tests only: no hardware (no ALSA, no Bluetooth, no realtime module, no
# D-Bus), two null sinks and a null source. Started by tests/mixer_pipewire.rs in its own
# XDG_RUNTIME_DIR, so it never meets the session's own PipeWire.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.allow-mlock = false
    default.clock.rate = 48000
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    # clients are held until their permissions are set: every client of this test is trusted
    { name = libpipewire-module-access
        args = { access.socket = { pipewire-0 = "unrestricted", pipewire-0-manager = "unrestricted" } }
    }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager flags = [ ifexists nofail ] }
]
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            node.group      = pipewire.dummy
            priority.driver = 20000
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = test_speakers
            node.description = "Test Speakers"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 2000
            monitor.channel-volumes = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = test_headphones
            node.description = "Test Headphones"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            priority.session = 1000
            monitor.channel-volumes = true
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = test_mic
            node.description = "Test Microphone"
            media.class      = Audio/Source/Virtual
            audio.position   = [ MONO ]
        }
    }
]
