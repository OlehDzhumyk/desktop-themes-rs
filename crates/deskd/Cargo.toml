[package]
name = "deskd"
description = "Desktop features daemon (session D-Bus service): clipboard history and other engines behind the GNOME Shell bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deskd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
gio.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
desk-proto.workspace = true
desk-settings = { workspace = true, features = ["gio"] }
# colour picker formats, CSS colour names and WCAG contrast (workspace crate, no new dependency)
theme-tokens.workspace = true
# setrlimit, prctl and unshare for the OCR child process (already a workspace dependency)
libc.workspace = true
# screenshot core: PNG checks, metadata scrubbing, saving, redaction (workspace crate, pure Rust)
desk-capture.workspace = true
# window layouts core: built-in layouts, zone geometry, layouts.json (workspace crate, pure Rust)
desk-layouts.workspace = true
# search core: query parser, calculator, ranking, desktop entries, usage store (workspace crate, pure Rust)
desk-search.workspace = true
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
pipewire = { version = "0.10.1", optional = true }

[features]
default = ["pipewire"]
# the PipeWire backend of the mixer engine (needs pipewire-devel and clang to build)
pipewire = ["dep:pipewire"]

[dev-dependencies]
# Trust::with_binaries and Gate::open in the D-Bus tests
desk-proto = { workspace = true, features = ["test-util"] }
# peer-to-peer connections: the D-Bus API tests need no bus daemon
zbus = { workspace = true, features = ["p2p"] }
