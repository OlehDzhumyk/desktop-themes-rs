[package]
name = "desk-shell"
description = "DE-agnostic Wayland desktop shell of desktop-themes-rs: taskbar and Start/Search flyout on wlr-layer-shell compositors (GTK 4, gtk4-layer-shell loaded at run time)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "desk-shell"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
gtk.workspace = true
# dlopen of libgtk4-layer-shell.so.0 (no -devel package and no link-time dependency)
libc.workspace = true
desk-proto.workspace = true
desk-search.workspace = true
desk-settings = { workspace = true, features = ["gio"] }
