[package]
name = "themes"
description = "GNOME desktop theme manager: switch and mix look, behavior, sounds and app settings (CLI + GUI + D-Bus)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "themes"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw.workspace = true
clap.workspace = true
gtk.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
# blocking pool of the D-Bus service (already built for zbus with this feature)
zruntime = { version = "0.2.4", default-features = false, features = ["unblock"] }
themes-core.workspace = true
desk-proto.workspace = true
desk-settings = { workspace = true, features = ["gio"] }
# the screenshot editor: decode, annotate (destructive redaction), encode and save atomically
desk-capture.workspace = true

[dev-dependencies]
# Trust::with_binaries and Gate::open in the D-Bus tests
desk-proto = { workspace = true, features = ["test-util"] }
# peer-to-peer connections: the gate test needs no bus daemon
zbus = { workspace = true, features = ["p2p"] }
