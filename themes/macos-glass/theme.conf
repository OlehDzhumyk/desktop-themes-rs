NAME="macOS Liquid Glass (експериментальна)"
DESCRIPTION="ЕКСПЕРИМЕНТАЛЬНА: на GNOME Shell 51.1 на реальному обладнанні оболонка падала (SIGSEGV у St під час малювання рамок) за ~20 с після застосування, після чого GNOME вимикає всі розширення. Тема macOS + Liquid Glass (скло на панелі, доці, меню). Шейдер сильно навантажує GPU."
# Everything that is not here (look, behavior, sounds, apps, skin) comes from macos.
INHERITS=macos
# Applying asks for confirmation (CLI --yes, dialogs in the window and in quick settings).
EXPERIMENTAL=true
WARNING="Experimental: on GNOME Shell 51.1 on real hardware the shell crashed (SIGSEGV in St while drawing borders) about 20 s after applying, and GNOME then turns all extensions off. The Liquid Glass shader also loads the GPU heavily. Apply only if you can recover (themes reset from a terminal or another session)."
WARNING_UK="Експериментальна: на GNOME Shell 51.1 на реальному обладнанні оболонка падала (SIGSEGV у St під час малювання рамок) приблизно за 20 с після застосування, після чого GNOME вимикає всі розширення. Шейдер Liquid Glass також сильно навантажує GPU. Застосовуйте, лише якщо зможете відновитися (themes reset у терміналі чи з іншого сеансу)."
