# cargo-nextest configuration. Local default: quiet, failures only. CI: `--profile ci`.
# Flaky tests are fixed, not retried, so retries stay 0 everywhere.

[profile.default]
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"

[profile.ci]
fail-fast = false
retries = 0
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
