id: no-live-settings-in-tests
valid:
  - |
    fn real() { Command::new("dconf").arg("write"); }
  - |
    #[cfg(test)]
    mod tests { fn t() { let x = 1; } }
invalid:
  - |
    #[cfg(test)]
    mod tests { fn t() { Command::new("dconf").arg("write"); } }
  - |
    #[cfg(test)]
    mod tests { fn t(s: Settings) { s.set_string("k", "v").unwrap(); } }
  - |
    #[test]
    fn t(s: Settings) { s.set_boolean("k", true).unwrap(); }
