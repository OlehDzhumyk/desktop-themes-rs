id: no-default-hasher
language: rust
severity: error
message: >-
  `DefaultHasher` is not guaranteed stable across Rust releases. Do not use it for hashes that are
  persisted, compared across runs or sent over D-Bus; use `desk_settings::stable_hash` (FNV-1a).
note: |
  Fine for in-memory HashMap use only; then suppress with `// ast-grep-ignore: no-default-hasher`.
rule:
  any:
    - kind: type_identifier
      regex: ^DefaultHasher$
    - kind: identifier
      regex: ^DefaultHasher$
