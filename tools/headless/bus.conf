<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session bus of the headless GNOME Shell. Only the system-wide service directories and
     the environment's own one (deskd under test) are used, never ~/.local/share/dbus-1/services,
     so none of the user's own services (e.g. the real `themes` service) runs here. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:path=@SOCK@</listen>
  <auth>EXTERNAL</auth>
  <servicedir>@SERVICES@</servicedir>
  <servicedir>/usr/share/dbus-1/services</servicedir>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
